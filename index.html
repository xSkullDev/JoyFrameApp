<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JoyFrame Photobooth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>JoyFrame Photobooth</h1>
    <div class="camera">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <label for="overlaySelect">Overlay:</label>
      <select id="overlaySelect">
        <option value="none">Tanpa Overlay</option>
        <option value="frame">Frame Kayu</option>
        <option value="hearts">Hearts</option>
        <option value="vintage">Vintage</option>
        <option value="text">Teks "Smile"</option>
      </select>

      <button id="capture">Ambil Foto</button>
      <button id="download" disabled>Download</button>
      <button id="switchMirror">Toggle Mirror</button>
      <button id="fullscreenBtn">Tampilan Layar Penuh</button>
      <button id="pipBtn">Picture-in-Picture</button>
      <input id="uploadSticker" type="file" accept="image/*">
    </div>

    <div class="preview">
      <img id="photoPreview" alt="Preview foto">
    </div>

    <p class="hint">Izinkan kamera bila diminta. Unggah stiker untuk menambah foto.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
