<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JoyFrame Photobooth</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>JoyFrame Photobooth</h1>

    <div class="booth">
      <div class="preview-wrap">
        <div class="pose-indicator hidden" id="pose">Pose: Ready</div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay" class="overlay-canvas" aria-hidden="true"></canvas>
        <div class="countdown hidden" id="countdown">3</div>
      </div>

      <div class="controls">
        <div class="layout-selector">
          <h3>Overlay</h3>
          <div class="layout-list">
            <button class="layout-thumb" data-val="none">None</button>
            <button class="layout-thumb" data-val="frame">Frame</button>
            <button class="layout-thumb" data-val="hearts">Hearts</button>
            <button class="layout-thumb" data-val="vintage">Vintage</button>
            <button class="layout-thumb" data-val="text">Text</button>
          </div>
        </div>

        <div class="options">
          <label>Stickers</label>
          <div class="stickers">
            <button class="sticker-btn" data-emoji="😎">😎</button>
            <button class="sticker-btn" data-emoji="🎉">🎉</button>
            <button class="sticker-btn" data-emoji="❤️">❤️</button>
            <input id="uploadSticker" type="file" accept="image/*">
          </div>
        </div>

        <div class="controls-row">
          <button id="capture" class="big-capture">●</button>
          <div>
            <button id="download" disabled>Download</button>
          </div>
          <div>
            <button id="flipBtn">Flip</button>
          </div>
        </div>

        <div class="gallery">
          <h3>Gallery</h3>
          <div class="gallery-list" id="gallery"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
