<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyFrame - Web Photobooth</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .booth-container { position: relative; display: inline-block; border: 10px solid #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; background: #000; }
        video { display: block; width: 640px; height: 480px; transform: scaleX(-1); } /* Mirroring */
        #frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .controls { margin-top: 20px; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #ff4757; color: white; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ff6b81; }
        canvas { display: none; } /* Tersembunyi, hanya untuk proses rendering */
        #gallery { margin-top: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        #gallery img { width: 200px; border: 5px solid #fff; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>JoyFrame Photobooth</h1>
    
    <div class="booth-container">
        <video id="video" autoplay playsinline></video>
        <img id="frame-overlay" src="https://raw.githubusercontent.com/xskulldev/JoyFrameApp/main/assets/frames/frame1.png" alt="frame">
    </div>

    <div class="controls">
        <button id="capture">AMBIL FOTO</button>
    </div>

    <canvas id="canvas" width="640" height="480"></canvas>

    <h2>Galeri Anda</h2>
    <div id="gallery"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture');
        const frameOverlay = document.getElementById('frame-overlay');
        const gallery = document.getElementById('gallery');

        // 1. Akses Kamera
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal mengakses kamera: " + err);
            }
        }

        // 2. Tangkap Foto dan Gabungkan dengan Frame
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            
            // Gambar Video ke Canvas (Mirroring)
            context.save();
            context.scale(-1, 1);
            context.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            context.restore();

            // Gambar Overlay Frame di atasnya
            context.drawImage(frameOverlay, 0, 0, canvas.width, canvas.height);

            // Konversi ke Gambar
            const imageData = canvas.toDataURL('image/png');
            
            // Tampilkan di Galeri
            const img = document.createElement('img');
            img.src = imageData;
            gallery.prepend(img);

            // Automatis Download (Opsional)
            const link = document.createElement('a');
            link.download = 'photobooth-capture.png';
            link.href = imageData;
            link.click();
        });

        setupCamera();
    </script>
</body>
</html>
